<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewbsterCode</title>
  <style>
    :root { color-scheme: light dark; --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --accent:#60a5fa; } }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
    main { max-width:640px; margin:15vh auto; padding:0 16px; }
    h1 { margin:0 0 .25em; font-size:2rem; }
    p { color:var(--muted); }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>NewbsterCode</h1>
    <p>Projects and open-source work from NewbsterCode.</p>
    <p><a href="https://github.com/NewbsterCode">github.com/NewbsterCode</a> · <a href="https://newbstercode.com">newbstercode.com</a></p>
  </main>
</body>
</html>
